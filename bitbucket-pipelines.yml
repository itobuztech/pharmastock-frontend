image: node:20.10.0-alpine3.19

definitions:
  steps:
    - step: &s3-pipeline-anchor
        name: "s3 pipeline"
        caches:
          - node
        script:
          - npm install -g corepack
          - echo 's3 pipeline start'
          - cd client
          - |
            cat <<EOF > ./.env
            VITE_PHARMA_STOCK_API_URL=${VITE_PHARMA_STOCK_API_URL}
            EOF
          
          - yarn
          - yarn build:production
          - pipe: atlassian/aws-s3-deploy:1.6.0
            variables:
              AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
              AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
              AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
              S3_BUCKET: ${S3_BUCKET_NAME}
              LOCAL_PATH: ./dist/
          - echo 's3 pipeline end'


pipelines:
  branches:
    cicd:
      - stage:
          name: test pipeline
          deployment: dev
          steps:
            - step:
                <<: *s3-pipeline-anchor

    dev:
      - stage:
          name: pharmastock-frontend-dev pipeline
          deployment: dev
          steps:
            - step:
                <<: *s3-pipeline-anchor

    main:
      - stage:
          name: pharmastock-frontend-prod pipeline
          deployment: prod
          steps:
            - step:
                <<: *s3-pipeline-anchor